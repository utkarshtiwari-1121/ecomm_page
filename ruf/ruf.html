<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: #e7e9eb;
      }
      #myDIV {
        height: auto;
        display: grid;
        grid-template-columns: auto auto auto auto;
        gap: 10px;
        grid-template-areas: 
        'box7 box7 box7 box7'
        'box2 box3 box4 box4'
        'box5 box5 box6 box6'
        'box1 box1 box1 box1'
        ;
        background-color: #2196f3;
        padding: 10px;
      }
      #myDIV div {
        background-color: rgba(255, 255, 255, 0.8);
        text-align: center;
        padding: 20px 0;
        font-size: 30px;

      }
      
    </style>
  </head>

  <body>
    <div
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #faf3e0;
        width: 12rem;
        height: 12rem;
      "
    >
      <div
        style="
          border-radius: 50%;
          border: 4px solid red;
          width: 3rem;
          height: 3rem;
          background-color: rgb(230, 174, 174);
        "
      ></div>
    </div>
    <!-- <h1>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Delectus, in. Repudiandae quod voluptatem deleniti natus officia ullam illo? Tempora aliquid odit explicabo repellendus nihil, eius aperiam officiis adipisci amet. Consequatur!</h1> -->

    <h1>The grid-column property</h1>

    <div id="myDIV">
      <div style="grid-area: box1;" class="item1">1</div>
      <div style="grid-area: box2;" class="item2">2</div>
      <div style="grid-area: box3;" class="item3">3</div>
      <div style="grid-area: box4;" class="item4">4</div>
      <div style="grid-area: box5;" class="item5">5</div>
      <div style="grid-area: box6;" class="item6">6</div>
      <div style="grid-area: box7;" class="item7">7</div>
    </div>
  </body>
</html>
